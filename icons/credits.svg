<!--
  Créditos de partida. Arte propio de Easy HUD.

  El catálogo público de VALORANT no publica el símbolo de crédito de partida
  (solo las monedas de tienda), así que este glifo es nuestro. Se dibuja como
  rombo con barra: a 11 px sobre vídeo comprimido, una forma angular con un
  solo trazo interior sigue leyéndose, y un símbolo con curvas o detalle fino
  se convierte en una mancha.

  El color va FIJO en el fichero, no con `currentColor`: este SVG se carga
  desde un `<img>`, y un `<img>` es un documento independiente sin nadie de
  quien heredar, así que `currentColor` resolvía a negro sobre una tarjeta
  negra. Es el mismo verde que el número al que acompaña.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none"
     stroke="#4ad991" stroke-width="1.8" stroke-linejoin="miter">
  <path d="M8 1.6 14.4 8 8 14.4 1.6 8Z" />
  <path d="M5.2 8h5.6" stroke-linecap="butt" />
</svg>
