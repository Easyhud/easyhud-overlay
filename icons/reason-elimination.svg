<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" role="img" aria-label="Ronda ganada por eliminación">
  <!--
    Ronda ganada eliminando al equipo rival.

    Es el círculo con la X, que es la convención que usan las emisiones y los
    sitios de estadísticas. La primera versión era una calavera: se leía bien
    pero **no era lo que el espectador ya conoce**, y en un riel de 24 casillas
    lo que importa es reconocer sin leer.

    Aro con agujero de verdad más una X, todo formas rellenas y sin trazos,
    para que valga en línea y como máscara. Ver el README.
  -->
  <path fill-rule="evenodd" d="M12 1.6a10.4 10.4 0 1 0 0 20.8 10.4 10.4 0 0 0 0-20.8Zm0 2.6a7.8 7.8 0 1 1 0 15.6 7.8 7.8 0 0 1 0-15.6Z" />
  <rect x="6.2" y="10.8" width="11.6" height="2.4" rx="1.2" transform="rotate(45 12 12)" />
  <rect x="6.2" y="10.8" width="11.6" height="2.4" rx="1.2" transform="rotate(-45 12 12)" />
</svg>
