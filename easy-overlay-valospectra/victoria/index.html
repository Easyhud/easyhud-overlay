<!-- ══════════════════════════════════════════════════════════════════════════
     VICTORIA · marcado completo, sin plantillas ni framework.

     Cuatro planos, de fondo a frente:
       0. muro tipográfico con el nombre del ganador (solo trazo, en bucle)
       1. retícula fina que sostiene el plano
       2. logo del ganador al centro
       3. banda oscura con la palabra, cruzándolo por delante

     El color del ganador entra por dos variables en .vic:
       --c   color plano del bando      (--atk | --def)
       --cl  su tono claro, para el filete de la banda

     Las animaciones se disparan poniendo .es-entra / .es-sale en .vic.
     En reposo no hay ninguna: lo que se ve aquí ES el estado final.
     ══════════════════════════════════════════════════════════════════════════ -->
