<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" role="img" aria-label="Spike detonada">
  <!--
    Ronda ganada por detonación.

    La llama, que es la convención de esta iconografía. Va por la tercera
    versión: la primera era una spike plantada dibujada a mano (no es el glifo
    que el espectador asocia con "explotó") y la segunda salía una llama
    asimétrica que a tamaño grande parecía una gota de agua.

    Esta lleva la punta y los dos picos laterales marcados, que es lo que la
    hace leer como fuego y no como gota. Una sola forma rellena, sin trazos ni
    agujeros: es lo que mejor aguanta los 16 px de la tira del historial.
  -->
  <path d="M12 .8 14.2 7l3.2-3.5c.2 2.5-.8 4.2-1.8 5.7 1.3 1.5 2.1 3.4 2.1 5.3 0 4.1-2.6 7.3-5.7 7.3S6.3 18.6 6.3 14.5c0-1.9.8-3.8 2.1-5.3C7.4 7.7 6.4 6 6.6 3.5L9.8 7 12 .8Z" />
</svg>
