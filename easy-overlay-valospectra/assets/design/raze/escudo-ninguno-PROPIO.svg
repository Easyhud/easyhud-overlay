<!--
  Sin escudo. Arte propio de Easy HUD.

  El juego no tiene icono para "sin escudo": es la ausencia de icono. Pero un
  hueco vacío en la tarjeta se confunde con un dato que falta, y la diferencia
  entre "no lleva escudo" y "no lo sabemos" es justo la que este overlay se
  toma en serio. Un contorno vacío dice "cero", no "desconocido".

  Color fijo y no `currentColor`, por lo mismo que en credits.svg: se carga
  desde un `<img>` y ahí `currentColor` es negro.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none"
     stroke="#6c6e75" stroke-width="1.6" stroke-linejoin="miter">
  <path d="M8 1.8 13.6 4v4.4C13.6 11.4 11.2 13.6 8 14.6 4.8 13.6 2.4 11.4 2.4 8.4V4Z" />
</svg>
