<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easy HUD · directo</title>
<style>
  /*
    UNA sola fuente para OBS.
    =========================

    Dentro van las siete pantallas, cada una en su marco, y se enseña la que
    toca según lo que esté pasando en la partida. El operador pone esto en
    OBS y no vuelve a tocarlo en todo el torneo.

    ## Por qué marcos y no todo en una página

    Porque cada pantalla trae su propia hoja de estilos y cuatro clases se
    repiten entre ellas (`banda`, `muro`, `reticula`, `extruido`). Cargadas
    juntas, la última gana y rompe a las otras —y el CSS se aplica aunque el
    elemento esté oculto, así que esconder no basta—. Un marco es un ámbito
    de estilos de verdad: cada diseño queda exactamente como se hizo, sin
    tocarle una línea.

    El precio es una conexión por pantalla. El servidor solo reparte estado,
    así que siete sockets le cuestan lo mismo que uno.
  */
  /*
    Transparente de arriba abajo. Detrás va el vídeo del juego, y cualquier
    color opaco en el camino lo tapa.
  */
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  /*
    Los marcos se montan la PRIMERA vez que hacen falta y ya no se quitan:
    montarlos y desmontarlos volvería a lanzar las animaciones de entrada y
    a rehacer la conexión cada vez.
  */
  .capa {
    position: absolute;
    inset: 0;
    border: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    /* Oculto no es lo mismo que desmontado: la pantalla sigue viva detrás. */
    visibility: hidden;
  }
  .capa--puesta { visibility: visible; }

  /* Un aviso en la esquina cuando no hay nada que enseñar, solo con dev=1. */
  #dev {
    position: fixed;
    left: 12px;
    bottom: 12px;
    z-index: 9;
    padding: 7px 12px;
    border-radius: 7px;
    background: rgb(10 10 14 / 88%);
    color: #e7e7ec;
    font: 12px/1.45 system-ui, sans-serif;
    pointer-events: none;
    display: none;
  }
</style>
</head>
<body>
<div id="dev"></div>
<script type="module" src="./index.js"></script>
</body>
</html>
