<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easy HUD · combate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/hud.css">
<link rel="stylesheet" href="./css/combate.css">
</head>
<body>
<!--
  COMBATE — en directo.

  El marcado de este fichero es el del fotograma estático que salió de diseño,
  con TRES huecos: el marcador, la banda de serie y las dos columnas. Los
  rellena `js/combate.js` con lo que llega del servidor.

  Lo que NO está y estaba en el estático: el aviso de spike con su visor 3D.
  Se quitó a propósito, para ponerlo cuando toque y no antes.

  El CSS no se ha tocado ni una línea.
-->

<div class="escenario">

  <!-- ══ Marcador (permanente) ══ -->
  <div class="marcador" id="marcador"></div>
  <div class="ronda-chip" id="ronda"></div>
  <div class="aleta aleta--izq"></div>
  <div class="aleta aleta--der"></div>
  <div class="serie serie--izq" id="serie-izq"></div>
  <div class="serie serie--der" id="serie-der"></div>


  <!-- ══ Columna izquierda (ataque) ══ -->
  <div class="columna columna--izq" id="col-izq"></div>

  <!-- ══ Columna derecha (defensa) ══ -->
  <div class="columna columna--der" id="col-der"></div>

  <div class="marca">EASY OPEN · easyhud.net</div>
</div>

<script src="./js/escenario.js?v=2"></script>
<script type="module" src="./js/combate.js"></script>
</body>
</html>
