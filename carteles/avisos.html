<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easy HUD · Avisos del operador — HUD Easy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/hud.css">
<link rel="stylesheet" href="./css/cartel.css">
<link rel="stylesheet" href="./css/avisos.css">
</head>
<body>

<div class="escenario">

  <!-- ══ Rótulo del operador ══
       Misma caja que pausa y ronda ganada. Lo que distingue al tiempo muerto
       es su etiqueta, su color y el logo del equipo al fondo; los avisos de
       producción van neutros y sin logo. -->
  <div class="marcador">
    <div class="equipo" style="--c: var(--atk);">
      <div class="equipo__filo"></div>
      <div class="equipo__logo"></div>
      <span class="equipo__tricode"></span>
      <span style="flex:1"></span>
      <span class="equipo__tanto"></span>
    </div>
    <div class="marcador__hueco"></div>
    <div class="equipo equipo--der" style="--c: var(--def);">
      <div class="equipo__filo"></div>
      <div class="equipo__logo"></div>
      <span class="equipo__tricode"></span>
      <span style="flex:1"></span>
      <span class="equipo__tanto"></span>
    </div>
  </div>
  <div class="ronda-chip"></div>
  <div class="aleta aleta--izq"></div>
  <div class="aleta aleta--der"></div>

  <div class="cartel aviso" id="cartel" style="--c: var(--def); --cl: var(--def-light);">

    <div class="cartel__fondo" id="fondoLogo">
      <div>
        <i style="background-image: url('./assets/prx-logo.png'); transform: translate(-11.7px, 10.4px); filter: brightness(.12) saturate(0);"></i>
        <i style="background-image: url('./assets/prx-logo.png'); transform: translate(-7px, 6.2px);     filter: brightness(.18) saturate(0);"></i>
        <i style="background-image: url('./assets/prx-logo.png'); transform: translate(-2.3px, 2.1px);   filter: brightness(.24) saturate(0);"></i>
        <i style="background-image: url('./assets/prx-logo.png'); transform: translate(2.3px, -2.1px);   filter: brightness(.30) saturate(0);"></i>
        <i style="background-image: url('./assets/prx-logo.png'); transform: translate(7px, -6.2px);     filter: brightness(.36) saturate(0);"></i>
        <i style="background-image: url('./assets/prx-logo.png'); transform: translate(11.7px, -10.4px);"></i>
      </div>
    </div>

    <div class="cartel__filo"></div>

    <div class="cartel__cuerpo">
      <span class="cartel__dato" id="titulo" style="margin-bottom: 11px;">Tiempo muerto</span>
      <span class="cartel__etq" id="etiqueta" style="margin-bottom: 11px;">Paper Rex</span>
      <span class="aviso__texto" id="texto">Volvemos en un minuto</span>
    </div>
  </div>

  <!-- ══ Patrocinadores ══ una marca a la vez, relevándose -->
  <div class="patro">
    <span class="patro__etq">patrocina</span>
    <div class="patro__filete"></div>
    <div class="patro__hueco"><span class="patro__marca" id="marca">LOGITECH G</span></div>
  </div>

  <div class="marca-agua">EASY OPEN · easyhud.net</div>

</div>

<script>
/* Tres clases de aviso. El de equipo lleva color y logo; los de producción
   van en gris neutro. */
const AVISOS = [
  { titulo: 'Tiempo muerto', etiqueta: 'Paper Rex',  texto: 'Volvemos en un minuto', logo: true },
  { titulo: 'Pausa técnica', etiqueta: 'producción', texto: 'Reanudamos la ronda 18', logo: false },
  { titulo: 'Siguiente mapa', etiqueta: 'aviso',     texto: 'Split · en cinco minutos', logo: false }
];
window.claseAviso = (() => {
  let i = 0;
  const cartel = document.getElementById('cartel');
  return {
    etiqueta: 'Cambiar aviso',
    accion() {
      i = (i + 1) % AVISOS.length;
      const a = AVISOS[i];
      cartel.style.setProperty('--c', a.logo ? 'var(--def)' : '#8b8d94');
      cartel.style.setProperty('--cl', a.logo ? 'var(--def-light)' : '#c9cad0');
      document.getElementById('titulo').textContent = a.titulo;
      document.getElementById('etiqueta').textContent = a.etiqueta;
      document.getElementById('texto').textContent = a.texto;
      document.getElementById('fondoLogo').style.display = a.logo ? '' : 'none';
    }
  };
})();

/* Los patrocinadores se relevan al compás de la animación del hueco, para que
   el cambio de texto caiga en el instante en que está invisible. */
const MARCAS = ['LOGITECH G', 'RED BULL', 'SECRETLAB'];
let m = 0;
setInterval(() => {
  m = (m + 1) % MARCAS.length;
  document.getElementById('marca').textContent = MARCAS[m];
}, 5000);
</script>
<script src="./js/escenario.js?v=2"></script>
<script type="module" src="./js/avisos.js"></script>
</body>
</html>
