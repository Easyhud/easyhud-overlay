<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easy HUD · Pausa — HUD Easy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/hud.css">
<link rel="stylesheet" href="./css/cartel.css">
<link rel="stylesheet" href="./css/pausa.css">
</head>
<body>

<div class="escenario">

  <!-- ══ Marcador permanente ══
       No entra ni sale con el cartel: está en pantalla toda la ronda. -->
  <div class="marcador">
    <div class="equipo" style="--c: var(--atk);">
      <div class="equipo__filo"></div>
      <div class="equipo__logo" style="background-image: url('./assets/inf-logo.webp');"></div>
      <span class="equipo__tricode">INF</span>
      <span style="flex:1"></span>
      <span class="equipo__tanto">8</span>
    </div>
    <div class="marcador__hueco"></div>
    <div class="equipo equipo--der" style="--c: var(--def);">
      <div class="equipo__filo"></div>
      <div class="equipo__logo" style="background-image: url('./assets/prx-logo.png');"></div>
      <span class="equipo__tricode">PRX</span>
      <span style="flex:1"></span>
      <span class="equipo__tanto">9</span>
    </div>
  </div>
  <div class="ronda-chip">ronda 18</div>
  <div class="aleta aleta--izq"></div>
  <div class="aleta aleta--der"></div>

  <!-- ══ Cartel de pausa ══
       Arranca como tiempo muerto de PRX: lleva su color, su logo al fondo y
       el cupo que le queda. El botón «Técnica» lo pasa a neutro. -->
  <div class="cartel pausa" id="cartel" style="--c: var(--def); --cl: var(--def-light);">

    <div class="cartel__fondo" id="fondoLogo">
      <div>
        <i style="background-image: url('./assets/prx-logo.png'); transform: translate(0px, 0px);    filter: brightness(.18) saturate(0);"></i>
        <i style="background-image: url('./assets/prx-logo.png'); transform: translate(5.2px, -4.4px);  filter: brightness(.28) saturate(0);"></i>
        <i style="background-image: url('./assets/prx-logo.png'); transform: translate(10.4px, -8.8px); filter: brightness(.38) saturate(0);"></i>
        <i style="background-image: url('./assets/prx-logo.png'); transform: translate(15.6px, -13.2px); filter: brightness(.48) saturate(0);"></i>
        <i style="background-image: url('./assets/prx-logo.png'); transform: translate(20.8px, -17.6px); filter: brightness(.56) saturate(0);"></i>
        <i style="background-image: url('./assets/prx-logo.png'); transform: translate(24.7px, -20.9px);"></i>
      </div>
    </div>

    <div class="cartel__filo"></div>

    <div class="cartel__cuerpo">
      <div class="pausa__cab">
        <span class="pausa__tipo" id="tipo">Tiempo muerto</span>
        <span class="cartel__etq" id="quien">Paper Rex</span>
      </div>

      <div class="pausa__reloj">
        <span class="cartel__dato" id="reloj">0:47</span>
        <div class="pausa__pista"><div class="pausa__relleno" style="width: 62%;"></div></div>
      </div>

      <div class="pausa__cupo" id="cupo">
        <span>le quedan</span>
        <div class="pausa__pips">
          <i class="on"></i><i class="on"></i><i></i>
        </div>
        <span id="cupoTexto">de 3 tiempos muertos</span>
      </div>
    </div>
  </div>

</div>

<script>
/* Alterna los dos tipos de pausa. La diferencia no es solo el texto: el
   técnico va neutro, sin logo y sin cupo, porque no hay nada que contar. */
window.tipoPausa = (() => {
  let tactico = true;
  const cartel = document.getElementById('cartel');
  return {
    etiqueta: 'Cambiar tipo',
    accion() {
      tactico = !tactico;
      cartel.style.setProperty('--c', tactico ? 'var(--def)' : '#8b8d94');
      cartel.style.setProperty('--cl', tactico ? 'var(--def-light)' : '#c9cad0');
      document.getElementById('tipo').textContent = tactico ? 'Tiempo muerto' : 'Pausa técnica';
      document.getElementById('quien').textContent = tactico ? 'Paper Rex' : 'la pide la producción';
      document.getElementById('reloj').textContent = tactico ? '0:47' : '3:04';
      document.getElementById('cupo').style.display = tactico ? '' : 'none';
      document.getElementById('fondoLogo').style.display = tactico ? '' : 'none';
    }
  };
})();
</script>
<script src="./js/escenario.js?v=2"></script>
<script type="module" src="./js/pausa.js"></script>
</body>
</html>
