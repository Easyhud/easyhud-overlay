<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easy HUD · fase de compra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/hud.css">
<link rel="stylesheet" href="./css/compra.css">
</head>
<body>

<div class="escenario">

  <div class="marcador">
    <div class="equipo" style="--c:var(--atk)"><div class="equipo__filete"></div><img class="equipo__logo" src="./assets/inf-logo.webp" alt=""><span class="equipo__tri">INF</span><span class="equipo__sep"></span><span class="equipo__tanto">8</span></div>
    <div class="marcador__hueco"></div>
    <div class="equipo equipo--der" style="--c:var(--def)"><div class="equipo__filete"></div><img class="equipo__logo" src="./assets/prx-logo.png" alt=""><span class="equipo__tri">PRX</span><span class="equipo__sep"></span><span class="equipo__tanto">9</span></div>
  </div>
  <div class="ronda-chip" id="ronda"></div>
  <div class="aleta aleta--izq"></div>
  <div class="aleta aleta--der"></div>
  <div class="serie serie--izq" style="--cl:var(--atk-light)"></div>
  <div class="serie serie--der" style="--cl:var(--def-light)"></div>

  <div class="tablero">
    <div class="banda" id="banda"></div>
    <div id="filas" style="display:flex;flex-direction:column;gap:4px"></div>
  </div>
</div>

<script src="./js/escenario.js?v=2"></script>
<script type="module" src="./js/cdn.js"></script>
<script src="./js/poligono.js"></script>
<script src="./js/compra.js"></script>
<script type="module" src="./js/datos-compra.js"></script>
</body>
</html>
